<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="320" viewBox="0 0 1024 320" role="img" aria-label="inspectorai-solana-chat">
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="sol2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="320" rx="24" fill="#0b0d14"/>
  <!-- speed tracks -->
  <g opacity="0.9">
    <path d="M0 258 L1024 258" stroke="#9945FF" stroke-width="16" stroke-linecap="round"/>
    <path d="M0 288 L1024 288" stroke="#14F195" stroke-width="16" stroke-linecap="round"/>
    <path d="M120 258 L112 300" stroke="#0b0d14" stroke-width="16"/>
    <path d="M420 288 L412 320" stroke="#0b0d14" stroke-width="16"/>
    <path d="M700 258 L692 300" stroke="#0b0d14" stroke-width="16"/>
  </g>
  <!-- enclave hexagon + lock -->
  <g transform="translate(196 150)" filter="url(#glow)">
    <polygon points="0,-96 83,-48 83,48 0,96 -83,48 -83,-48"
             fill="#0f121c" stroke="#14F195" stroke-width="6"/>
    <rect x="-26" y="-4" width="52" height="46" rx="6" fill="#14F195"/>
    <path d="M-17 -4 v-30 a17 17 0 0 1 34 0 v30" fill="none" stroke="#9945FF" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800">
    <text x="340" y="152" font-size="62" fill="url(#sol)">solana-chat</text>
    <text x="340" y="204" font-size="27" fill="#c9d1e0" font-weight="500" letter-spacing="1">
      confidential compute client · openai-compatible
    </text>
    <text x="340" y="246" font-size="21" fill="#5c6a85" font-weight="500" letter-spacing="2">
      EHBP · HPKE · X25519 · AES-256-GCM · TEE
    </text>
  </g>
</svg>
